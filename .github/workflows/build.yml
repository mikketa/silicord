name: build

on:
  push:
  pull_request:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: ilammy/setup-nasm@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the QR test decoder
        run: pip install numpy zxing-cpp

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Size
        shell: pwsh
        run: |
          $size = (Get-Item build/silicord.exe).Length
          "silicord.exe : **$size bytes**" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: silicord-win64
          path: build/silicord.exe
