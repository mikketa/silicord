name: build

on:
  push:
  pull_request:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: ilammy/setup-nasm@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run
        shell: pwsh
        run: |
          ./build/silicord.exe
          $size = (Get-Item build/silicord.exe).Length
          "silicord.exe : **$size bytes**" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: silicord-win64
          path: build/silicord.exe
