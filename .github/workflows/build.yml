name: build

on:
  push:
  pull_request:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: ilammy/setup-nasm@v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the QR test decoder
        run: pip install numpy zxing-cpp

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Size
        shell: pwsh
        run: |
          $size = (Get-Item build/silicord.exe).Length
          "silicord.exe : **$size bytes**" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v5
        with:
          name: silicord-win64
          path: build/silicord.exe

  # The portable core, its tests and a fuzzer under AddressSanitizer and UBSan.
  linux-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install zlib and the QR test decoder
        run: |
          sudo apt-get install -y zlib1g-dev ninja-build
          pip install numpy zxing-cpp

      - name: Configure
        run: cmake -S tests/host -B build-host -G Ninja -DWERROR=ON -DFUZZ_ITERATIONS=20000

      - name: Build
        run: cmake --build build-host

      - name: Test and fuzz
        run: ctest --test-dir build-host --output-on-failure

      - uses: actions/cache@v4
        with:
          path: opus_newvectors
          key: opus-testvectors-rfc8251

      - name: Opus conformance
        run: sh tools/opus_vectors.sh build-host/opus_vectors opus_newvectors

      - uses: actions/cache@v4
        with:
          path: vp8_vectors
          key: vp8-testvectors-comprehensive

      - name: VP8 conformance
        run: sh tools/vp8_vectors.sh build-host/vp8_vectors vp8_vectors

      - name: VP8 encoder
        run: |
          sudo apt-get install -y ffmpeg
          sh tools/vp8_encode_check.sh build-host/vp8_roundtrip vp8_vectors
